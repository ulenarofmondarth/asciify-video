name: Release

# Pushing a tag such as v0.1.0 builds the package, publishes it to PyPI and
# creates a GitHub release. Run manually to publish a trial build to TestPyPI.
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored.
# One-time setup on pypi.org (and test.pypi.org for the manual run):
#   Publishing -> Add a pending publisher -> GitHub
#     owner:       ulenarofmondarth
#     repository:  asciify-video
#     workflow:    release.yml
#     environment: pypi        (testpypi on test.pypi.org)
#
# Read the Docs builds and publishes the documentation itself, from its own
# webhook on this repository, for every push and tag. Nothing here uploads it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    # Trusted Publishing only works from GitHub; skip if another forge that
    # understands this file (such as the Gitea origin) picks the tag up.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]" build twine
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(python -c 'from importlib.metadata import version; print(version("asciify-video"))')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
      - run: pytest
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/asciify-video/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/asciify-video/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the built distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
